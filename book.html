<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Trip</title>
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0f7fa;
            color: #333;
        }
        header {
            background: #0288d1;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 50%;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background: #0277bd;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #01579b;
        }
        footer {
            background: #0288d1;
            color: white;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Book Your Trip</h1>
    </header>

    <div class="container">
        <h2>Fill Your Details</h2>
        <form action="travel.html" method="get">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="destination">Choose Destination:</label>
            <select id="destination" name="destination">
                <option value="bali">Bali, Indonesia</option>
                <option value="rome">Rome, Italy</option>
                <option value="nyc">New York, USA</option>
            </select>

            <label for="date">Travel Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="package">Package Range ($500 - $5000):</label>
            <input type="range" id="package" name="package" min="500" max="5000" step="100" oninput="this.nextElementSibling.value = this.value">
            <output>2750</output>

            <label for="requests">Additional Requests:</label>
            <textarea id="requests" name="requests" rows="4" placeholder="Any special requirements?"></textarea>

            <button type="submit">Submit Booking</button>
        </form>
    </div>

    <footer>
        <p>Email: info@nomadicnest.com | Phone: +123 456 7890</p>
        <p>&copy; 2025 Nomadic Nest. All Rights Reserved.</p>
    </footer>
</body>
</html>
